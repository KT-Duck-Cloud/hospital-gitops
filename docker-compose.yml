# 로컬 개발용: MySQL 8.4 + 서비스 3개 (auth, reservation, stats) + 화면(web). 운영 배포는 helm/ 을 쓴다.
#
# 준비: powershell -ExecutionPolicy Bypass -File scripts\make_env.ps1   (.env 를 만든다. 비밀번호는 .env 에만 있다)
# 실행: docker compose up -d --build
#
# MySQL 은 데이터가 빈 첫 시작 때만 아래 순서로 초기화한다 (파일 이름 순서):
#   01-schema.sql → 02-grants.sh(db/grants.sql 에 .env 비밀번호를 넣어 실행) → 03-seed.sql
# 처음부터 다시 만들려면: docker compose down -v   (DB 데이터가 지워진다)

name: reservation-app

x-app-env: &app-env
  READ_ONLY_MODE: "false"
  SITE_NAME: local
  APP_VERSION: dev
  JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 이 없습니다. scripts/make_env.ps1 을 실행하세요}
  # DB_SSL_CA 를 넣지 않는다: 로컬은 MySQL 이 자동으로 만든 인증서라 TLS 암호화만 하고 CA·서버 이름 검증은 건너뛴다.

services:
  mysql:
    image: mysql:8.4.11
    command:
      - --default-time-zone=+00:00          # CURRENT_TIMESTAMP 기본값이 UTC 가 되도록
      - --require-secure-transport=ON       # TCP 연결은 TLS 만 허용
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 가 없습니다}
      MYSQL_DATABASE: hospital
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?.env 에 APP_RUNTIME_PASSWORD 가 없습니다}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?.env 에 APP_READONLY_PASSWORD 가 없습니다}
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD:?.env 에 APP_MIGRATE_PASSWORD 가 없습니다}
    ports:
      - "127.0.0.1:3306:3306"               # 내 PC 에서만 접속 (scripts/seed_users.py 용)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-grants.sh:/docker-entrypoint-initdb.d/02-grants.sh:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./db/grants.sql:/db/grants.sql:ro
    healthcheck:
      # 127.0.0.1(TCP)로 확인한다. 초기화 중에는 MySQL 이 TCP 를 닫고 있어서, 초기화가 끝난 뒤에야 healthy 가 된다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  auth:
    build:
      context: ../hospital-backend-auth
    environment:
      <<: *app-env
      DATABASE_URL: mysql+pymysql://app_runtime:${APP_RUNTIME_PASSWORD}@mysql:3306/hospital?charset=utf8mb4
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy

  reservation:
    build:
      context: ../hospital-backend-reservation
    environment:
      <<: *app-env
      DATABASE_URL: mysql+pymysql://app_runtime:${APP_RUNTIME_PASSWORD}@mysql:3306/hospital?charset=utf8mb4
      # 진료기록 키. 없으면 R11(내 진료기록)만 503 이고 나머지는 동작한다.
      MEDICAL_KEY: ${MEDICAL_KEY:-}
      MEDICAL_KEY_VERSION: ${MEDICAL_KEY_VERSION:-1}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  stats:
    build:
      context: ../hospital-backend-stats
    environment:
      <<: *app-env
      DATABASE_URL: mysql+pymysql://app_readonly:${APP_READONLY_PASSWORD}@mysql:3306/hospital?charset=utf8mb4
      # S1 시스템 상태에서 /readyz 를 확인할 다른 서비스 (이름=기본주소)
      SERVICE_URLS: auth=http://auth:8000,reservation=http://reservation:8000
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # 화면: http://localhost:8080  (/api/v1/* 는 nginx 가 auth·reservation·stats 로 넘긴다). DB·JWT 설정은 필요 없다.
  web:
    build:
      context: ../hospital-frontend
    environment:
      APP_VERSION: dev
      AUTH_UPSTREAM: http://auth:8000
      RESERVATION_UPSTREAM: http://reservation:8000
      STATS_UPSTREAM: http://stats:8000
    # 운영(Helm readOnlyRootFilesystem)과 같게: 쓰기는 /tmp 만
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - reservation
      - stats

volumes:
  mysql-data:

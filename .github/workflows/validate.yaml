name: GitOps validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitops-check-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  helm-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Helm 고정 버전 설치
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.4-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.4-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: 원본 Helm 차트 문법과 생성 결과 확인
        # 파일 생성 검사만 한다. 클러스터 접속·DB Job 실행은 하지 않는다.
        run: |
          helm lint helm/reservation-app
          helm template reservation-app helm/reservation-app > "$RUNNER_TEMP/rendered.yaml"
  original-tests:
    # 원본 테스트가 참조하는 분리 저장소를 Runner 안에만 배치한다. 원본 코드는 수정하지 않는다.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # 공개 저장소는 기본 토큰으로 읽을 수 있다. 비공개 앱 저장소는 이 읽기 전용 Secret이 필요하다.
      # PR에서는 앱 저장소의 main과의 호환성을 검사한다. 앱 이미지를 배포하는 단계가 아니다.
      - name: auth 원본 소스 읽기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/hospital-backend-auth
          ref: main
          path: services/auth
          token: ${{ secrets.CI_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: reservation 원본 소스 읽기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/hospital-backend-reservation
          ref: main
          path: services/reservation
          token: ${{ secrets.CI_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: stats 원본 소스 읽기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/hospital-backend-stats
          ref: main
          path: services/stats
          token: ${{ secrets.CI_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: web 원본 소스 읽기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/hospital-frontend
          ref: main
          path: web
          token: ${{ secrets.CI_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Helm 준비
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.4-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.4-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: 기존 데이터 검증·배포 설정 테스트
        run: python -m pytest tests/test_data_verifier.py tests/test_deploy_config.py -q

  configuration-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: GitOps 비밀정보 검사
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: GitOps 배포 설정 검사
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache

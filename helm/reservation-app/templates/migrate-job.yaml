{{- /*
표 만들기 Job: files/schema.sql 을 app_migrate 계정으로 실행한다 (helm hook pre-install/pre-upgrade, 기본 꺼짐).
- schema.sql 은 빈 DB 용이라 처음 설치할 때만 켠다: --set migrate.enabled=true
- app_migrate 접속 정보는 이 Job 만 쓴다 (앱 Pod 에는 넣지 않는다).
- 원본 DB(병원)에서만 실행한다. 복제·DR DB 는 read_only 라 실패한다.
- files/schema.sql 은 db/schema.sql 의 복사본이다. db/schema.sql 을 바꾸면 같이 복사한다.
*/ -}}
{{- if .Values.migrate.enabled }}
{{- $ctx := dict "root" . "name" "migrate" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reservation-app.serviceName" $ctx }}-schema
  labels:
    {{- include "reservation-app.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  schema.sql: |-
{{ .Files.Get "files/schema.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reservation-app.serviceName" $ctx }}
  labels:
    {{- include "reservation-app.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "reservation-app.selectorLabels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # mysql 이미지의 mysql 사용자
        runAsGroup: 999
        fsGroup: 999            # Secret 파일(0440)을 읽을 수 있게
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - >-
              exec mysql --defaults-extra-file=/etc/migrate/client.cnf
              {{- if .Values.secrets.dbCa.name }}
              --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/db-ca/ca.pem
              {{- else }}
              --ssl-mode=REQUIRED
              {{- end }}
              < /schema/schema.sql
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: client-config
              mountPath: /etc/migrate
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.dbCa.name }}
            - name: db-ca
              mountPath: /etc/db-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: schema
          configMap:
            name: {{ include "reservation-app.serviceName" $ctx }}-schema
        - name: client-config
          secret:
            secretName: {{ .Values.migrate.clientConfigSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.migrate.clientConfigSecret.key }}
                path: client.cnf
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.dbCa.name }}
        - name: db-ca
          secret:
            secretName: {{ .Values.secrets.dbCa.name }}
            items:
              - key: {{ .Values.secrets.dbCa.key }}
                path: ca.pem
        {{- end }}
{{- end }}

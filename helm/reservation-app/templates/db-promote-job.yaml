{{- if .Values.dbPromote.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-failover-promote
  labels:
    app.kubernetes.io/name: db-failover-promote
    app.kubernetes.io/part-of: reservation-app
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-failover-promote
    spec:
      restartPolicy: Never
      containers:
        - name: db-promoter
          image: {{ .Values.dbPromote.image | default "mysql:8.4" }}
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              set -e

              echo "Promoting local DB to master..."
              mysql -h db-service -u root -p"$DB_ROOT_PASSWORD" -e "STOP REPLICA;" 2>/dev/null || true
              mysql -h db-service -u root -p"$DB_ROOT_PASSWORD" <<EOF
              SET GLOBAL read_only = OFF;
              SET GLOBAL super_read_only = OFF;
              EOF

              READ_ONLY_STATUS=$(mysql -h db-service -u root -p"$DB_ROOT_PASSWORD" -se "SELECT @@read_only;")
              if [ "$READ_ONLY_STATUS" != "0" ]; then
                echo "DB promote failed: read_only=$READ_ONLY_STATUS"
                exit 1
              fi
              echo "Local DB successfully promoted to master: read_only=0"

              SERVER_ID=$(mysql -h db-service -u root -p"$DB_ROOT_PASSWORD" -se "SELECT @@server_id;")
              MY_DB_IP="100.64.0.${SERVER_ID}"
              echo "Active master DB IP identified as: ${MY_DB_IP}"

              ALL_NODES="{{ range .Values.dbClusterNodes }}{{ . }} {{ end }}"

              for TARGET_IP in $ALL_NODES; do
                if [ "$TARGET_IP" = "$MY_DB_IP" ]; then
                  continue
                fi

                echo "Reconfiguring replication target on ${TARGET_IP} to follow ${MY_DB_IP}..."
                if ! mysql -h "$TARGET_IP" -u root -p"$DB_ROOT_PASSWORD" --connect-timeout=2 <<EOF 2>/dev/null
              STOP REPLICA;
              SET GLOBAL read_only = ON;
              SET GLOBAL super_read_only = ON;
              CHANGE REPLICATION SOURCE TO
                SOURCE_HOST='${MY_DB_IP}',
                SOURCE_PORT=3306,
                SOURCE_USER='repl_user',
                SOURCE_PASSWORD='${DB_ROOT_PASSWORD}',
                SOURCE_AUTO_POSITION=1,
                GET_SOURCE_PUBLIC_KEY=1;
              START REPLICA;
              EOF
                then
                  echo "Node ${TARGET_IP} is offline or unreachable. Skipping."
                  continue
                fi
                echo "Node ${TARGET_IP} replication updated successfully."
              done

              echo "All standby nodes reconfigured."
              exit 0
          env:
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservation-app-db-runtime
                  key: DB_PASSWORD
      volumes: []
{{- end }}

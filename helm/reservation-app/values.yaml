# 공통 기본값. DR 실행 때 바꾸는 값은 values-dr-active.yaml.
#
# 설치 예 (온프레미스):
#   helm upgrade --install rsv helm/reservation-app -n default \
#     -f helm/reservation-app/values.yaml \
#     --set services.auth.image.tag=<커밋> --set services.reservation.image.tag=<커밋> --set services.stats.image.tag=<커밋> \
#     --set services.web.image.tag=<커밋>
# 서비스 하나만 바꿀 때 (나머지는 그대로):
#   helm upgrade rsv helm/reservation-app -n default --reuse-values --set services.auth.image.tag=<새 커밋>

# ---- 사이트 공통 (세 서비스에 함께 적용. DR 전환 때 한 번에 바뀐다) ----
# READ_ONLY_MODE: true 면 GET 외 요청은 503 (DR 대기)
readOnlyMode: false
siteName: "hospital"
# DB_URL: 계정 없는 DB 주소. K8s 내부 db-service가 각 노드의 vm2 DB로 자동 라우팅합니다.
dbUrl: "mysql://db-service:3306/hospital"

# FORWARDED_ALLOW_IPS: X-Forwarded-For 를 믿을 프록시(인그레스 컨트롤러) 주소. 쉼표로 여러 개, IP 대역(CIDR) 가능.
# 여기 있는 주소에서 온 요청만 X-Forwarded-For 의 실제 클라이언트 IP 를 쓴다 (감사 로그 client_ip, 로그인 IP 제한).
# 기본 127.0.0.1 = 프록시를 믿지 않음 (Pod 에 바로 붙은 주소를 씀). "*" 는 쓰지 않는다 (누구나 IP 를 속일 수 있음).
# 인그레스 컨트롤러 Pod 대역으로 좁혀 넣는다. 주의: NodePort 로 들어온 요청도 노드 주소로 바뀌어 들어오므로,
# 노드·브리지 주소가 포함된 넓은 대역(Pod 전체 대역 등)을 넣으면 NodePort 쪽에서 IP 를 속일 수 있다.
forwardedAllowIps: "127.0.0.1"

# HOSPITAL_PHONE: 병원 대표 번호 (연락처 화면). 공개 번호라 Secret 이 아니다. 지금 값은 가짜 번호이고 운영 값은 배포 담당이 바꾼다
# (예: --set hospitalPhone=02-1234-5678). 비우면 연락처 화면에 "등록된 번호가 없습니다". 예약 서비스(services.reservation.hospitalPhone)만 받는다.
hospitalPhone: "02-0000-0000"

# LOGIN_RATE_LIMIT_PER_MINUTE: 로그인 요청 제한 (분당 횟수). auth 서비스만 받는다.
loginRateLimitPerMinute: 20

# ---- 서비스별 설정 ----
# image.tag 는 비워 둔다 (배포할 때 --set 으로 Git 커밋 값을 넣는다. APP_VERSION 에도 쓰인다).
# dbUsername: DB 계정 이름 (DB_USERNAME). 비밀이 아니라 일반 값이다. auth·reservation=app_runtime, stats=app_readonly
# databaseSecret: 아래 secrets 의 어느 Secret 에서 DB_PASSWORD 를 받을지 (runtimeDatabase / readonlyDatabase)
# loginRateLimit: LOGIN_RATE_LIMIT_PER_MINUTE(위 loginRateLimitPerMinute)을 받는 서비스는 auth 뿐이다
# metricsNodePort: /metrics 를 모니터링이 읽는 NodePort (Service 가 NodePort 로 열린다)
services:
  auth:
    enabled: true
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-auth
      tag: "latest"
    dbUsername: app_runtime
    databaseSecret: runtimeDatabase
    loginRateLimit: true
    metricsNodePort: 30801
    resources: {}
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
  reservation:
    enabled: true
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-reservation
      tag: "latest"
    dbUsername: app_runtime
    databaseSecret: runtimeDatabase
    metricsNodePort: 30800
    medicalKey: true
    hospitalPhone: true
    resources: {}
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
  stats:
    enabled: true
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-stats
      tag: "latest"
    dbUsername: app_readonly
    databaseSecret: readonlyDatabase
    metricsNodePort: 30802
    resources: {}
    checkServices: [auth, reservation]
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
  web:
    enabled: true
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-web
      tag: "latest"
    containerPort: 8080    # nginx-unprivileged (root 아님)
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

# 클러스터 DNS 도메인 (web nginx 가 API Service 의 전체 이름을 만들 때 쓴다)
clusterDomain: cluster.local

image:
  pullPolicy: IfNotPresent
imagePullSecrets: []       # 예: [{name: ecr-pull}] (레지스트리 인증이 필요할 때)

# ---- 비밀 정보: 이미 클러스터에 있는 Secret 이름만 받는다. 차트는 Secret 을 만들지 않는다 ----
# (Secret·Sealed Secrets 는 IaC·보안 담당이 만든다. 이 차트에 비밀값을 넣지 않는다.)
secrets:
  # DB Secret 에는 DB_PASSWORD 만 둔다. 계정 이름(DB_USERNAME)은 services.<이름>.dbUsername 이다.
  runtimeDatabase:          # auth·reservation: app_runtime 계정의 비밀번호 (DB 주소는 위 dbUrl)
    name: reservation-app-db-runtime
    passwordKey: DB_PASSWORD
  readonlyDatabase:         # stats: app_readonly 계정의 비밀번호
    name: reservation-app-db-readonly
    passwordKey: DB_PASSWORD
  jwt:                      # JWT 서명 키 (세 서비스 동일, 32바이트 이상)
    name: reservation-app-jwt
    key: JWT_SECRET
  medicalKey:               # 진료기록 AES-256 키 (base64 32바이트). services.<이름>.medicalKey 가 true 인 서비스만 받는다
    name: reservation-app-medical-key
    key: MEDICAL_KEY
  dbCa:                     # DB TLS CA 인증서. name 이 비어 있으면 붙이지 않는다 (TLS 암호화만, 서버 검증 안 함)
    name: ""
    key: ca.pem

# DB 연결 풀 (세 API 서비스 공통, shared/config.py 의 DB_POOL_*). Pod 하나의 최대 연결 = size + maxOverflow.
# 연결을 꺼낼 때마다 살아 있는지 확인하므로(pool_pre_ping) DB 재시작·승격 뒤 다음 요청에서 새로 연결한다.
# recycle(초)은 MySQL wait_timeout(기본 8시간)·방화벽 유휴 끊김보다 짧게 둔다.
dbPool:
  size: 5
  maxOverflow: 5
  timeout: 5        # 풀이 다 찼을 때 기다리는 시간(초). 넘으면 503 DB_UNAVAILABLE
  recycle: 1800

# 진료기록 키 버전 (MEDICAL_KEY_VERSION). 키를 바꿀 때 올린다. 옛 키는 MEDICAL_KEY_V<버전> 으로 따로 넣는다 (shared/crypto.py)
medicalKeyVersion: 1

# ---- 서비스 공통 ----
service:
  port: 80
  targetPort: 8000
  # NodePort 로 열어 /metrics 를 모니터링이 읽는다 (metricsNodePort). false 면 ClusterIP.
  nodePortEnabled: true

metrics:
  enabled: true             # 파드에 prometheus.io/* annotation
  path: /metrics

ingress:
  enabled: true
  className: traefik
  host: ""                  # 비우면 모든 호스트
  tls: []                   # 예: [{secretName: rsv-tls, hosts: [rsv.example.com]}]
  annotations: {}

# 종료: Pod 삭제 시 preStop 으로 잠시 기다려 Service·Ingress 에서 빠진 뒤 SIGTERM.
# uvicorn 은 SIGTERM 을 받으면 새 요청을 받지 않고 진행 중 요청을 마친 뒤 끝난다 (최대 --timeout-graceful-shutdown 20초,
# 서비스 Dockerfile). 그 뒤 DB 풀을 닫는다. 반드시 preStopSleepSeconds + 20 < terminationGracePeriodSeconds 로 둔다
# (넘으면 처리 중 요청이 SIGKILL 로 끊긴다. tests/test_deploy_config.py 가 확인한다).
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

defaultResources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  # 시작이 느린 환경(첫 기동, 작은 VM)에서 liveness 가 먼저 죽이지 않도록 한다. 최대 periodSeconds*failureThreshold 초 기다림.
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 2       # /readyz 자체가 DB 검사를 1초에서 끊는다
    failureThreshold: 3

# ---- 표 만들기 Job (db/schema.sql, app_migrate 계정) ----
# 처음 설치할 때만 켠다: --set migrate.enabled=true  (schema.sql 은 빈 DB 용이라 표가 있으면 실패한다)
# 앱 Pod 에는 app_migrate 비밀번호가 들어가지 않는다. 이 Job 만 아래 Secret 을 쓴다.
migrate:
  enabled: false
  image: mysql:8.4.11       # mysql 클라이언트만 쓴다
  # [client] host=… port=… user=app_migrate password=… 형식의 옵션 파일을 담은 Secret
  clientConfigSecret:
    name: reservation-app-db-migrate
    key: client.cnf
  backoffLimit: 0
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# 전체 DR 클러스터 DB 목록 (사설망 Tailscale IP)
# db-promote-job이 DB의 server_id로 승격 대상 IP(100.64.0.${SERVER_ID})를 계산하고 목록을 순회하며 전체 DB 복제 체인을 자동 갱신합니다.
# 따라서 각 VM의 MySQL server_id는 반드시 Tailscale 사설 IP 끝자리와 일치해야 합니다 (예: 100.64.0.32 -> server_id 32).
dbClusterNodes:
  - "100.64.0.32"   # 홍석 DB
  - "100.64.0.52"   # 혜미 DB
  - "100.64.0.82"   # aws DB
  # - "100.64.0.XXX" # [추가 위치] DB 인스턴스 생성 시 Tailscale 사설 IP를 추가

# DB 승격 · 재동기화 훅 — 기본 꺼짐. 켜면 Argo 동기화(PreSync)마다 DB 를 바꾼다. 승격 · 복귀는 DR(duck-hsagent)이 한다 (argocd/README-dr.md)
dbPromote:
  enabled: false
  image: mysql:8.4

dbResync:
  enabled: false
  image: mysql:8.4
  targetMasterIp: ""

# 두 훅이 쓰는 DB 관리 계정 — Secret 은 사이트마다 1조 담당이 만든다 (값은 저장소에 두지 않음)
#   kubectl -n <ns> create secret generic reservation-app-db-admin \
#     --from-literal=DB_ROOT_PASSWORD=… --from-literal=REPL_USER=… --from-literal=REPL_PASSWORD=…
dbAdmin:
  secretName: reservation-app-db-admin
  rootPasswordKey: DB_ROOT_PASSWORD
  replUserKey: REPL_USER
  replPasswordKey: REPL_PASSWORD

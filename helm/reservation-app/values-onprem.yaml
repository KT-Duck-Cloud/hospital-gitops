# 1조: 병원 온프레미스 (kubeadm). 평상시 운영 사이트.
# 사용: helm upgrade --install rsv helm/reservation-app -n hospital -f values-onprem.yaml --set services.<이름>.image.tag=<커밋> ...
# 팀원 VM 이 작아서 서비스마다 1개씩 띄운다.

readOnlyMode: false
siteName: hospital
dbUrl: mysql://db-service:3306/hospital   # K8s 내부 db-service (각 슬롯의 vm2 DB 자동 연결)

ingress:
  className: traefik                      # 온프레미스 인그레스 컨트롤러 Traefik 사용

image:
  pullPolicy: IfNotPresent

ingress:
  className: traefik   # 1조: MetalLB + Traefik

services:
  auth:
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-auth
      tag: "latest"
  reservation:
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-reservation
      tag: "latest"
  stats:
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-stats
      tag: "latest"
  web:
    replicaCount: 1
    image:
      repository: 100.64.0.41:8086/duckcloud/reservation-app-web
      tag: "latest"

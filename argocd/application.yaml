apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reservation-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KT-Duck-Cloud/hospital-gitops.git
    targetRevision: main
    path: helm/reservation-app
    helm:
      valueFiles:
        - values-onprem.yaml
  destination:
    server: https://100.64.0.31:6443
    namespace: default
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
